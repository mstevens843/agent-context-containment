name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The frozen holdout grades the policy engine, so its integrity is checked before anything else
  # runs. Its own job, not a step inside build-test: this needs no dependencies and no toolchain, so
  # it fails in seconds rather than after an install and a build, and a red X here says "the corpus
  # drifted" rather than "something in CI broke".
  #
  # Do not fold this into `pnpm test`. A drift check buried inside a test command is a drift check
  # nobody sees the name of when it fails.
  corpus-integrity:
    name: Frozen holdout integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify holdout matches MANIFEST.sha256
        run: shasum -a 256 -c corpus/holdout/MANIFEST.sha256
      - name: Explain a failure
        if: failure()
        run: |
          echo "::error::The frozen holdout no longer matches its manifest."
          echo "The holdout is the instrument that grades the policy engine."
          echo "Do NOT regenerate the manifest to make this pass - find out what wrote to the file."
          echo "See docs/DEFECTS_FOUND.md section 5 and scripts/verify-corpus.sh."

  build-test:
    name: Lint, typecheck, build, test
    runs-on: ubuntu-latest
    needs: corpus-integrity
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  # THE CLAIM GATES. Everything in this job was built between v0.8 and v1.0 to stop the project
  # overstating itself, and until v1.0 none of it ran in CI - so the repository shipped with
  # `audit:docs` exiting 1 and a README number seven tests out of date, and every green checkmark
  # said nothing about it. That is defect §17 ("the control for the mutant apparatus was outside
  # CI") at the scale of the whole apparatus. See DEFECTS_FOUND.md §19.
  #
  # Separate job, not extra steps in build-test, for the same reason corpus-integrity is separate:
  # when this fails the red X should say "a claim went stale", not "the build broke".
  #
  # `packages/conformance/test/claimregistry.test.ts` asserts that every gate named here is really
  # here, so deleting a step fails the suite rather than quietly reducing coverage.
  claim-gates:
    name: Claim gates (docs, numbers, blocks, registry, mutations)
    runs-on: ubuntu-latest
    needs: corpus-integrity
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Generated blocks must match what the generators produce right now.
      - run: pnpm blocks:check
      # And so must docs/REPORT.md, which is a COMMITTED copy of generated output that
      # `blocks:check` never looked at - it covers GENERATED markers inside hand-written documents,
      # and this file has none. It could sit stale indefinitely with every gate green.
      - run: pnpm report:check
      # Every registered hand-typed number must agree with the command that produces it. This one
      # shells out to `pnpm test`, which is why it cannot live inside vitest and must run here.
      - run: pnpm verify:numbers
      # The prose guard: no document may overstate what the repository proves.
      - run: pnpm audit:docs
      # The claim registry's own rules, plus the corpus/classifier claim tests.
      - run: pnpm audit:claims
      # Delete each recorded fix and require a named test to fail. A mutation nothing bites is a
      # branch nobody is protecting.
      - run: pnpm audit:mutations
      # The property search. Deterministic, seeded, and it carries its own negative control: the
      # script exits non-zero if the loosened-table control finds NOTHING, because a search whose
      # control is silent is a search reporting its own optimism. Runs a far larger sweep than the
      # copy inside `pnpm test`, which is capped so the suite stays fast.
      - run: pnpm adversary
      # The whole deterministic release audit, which is a superset of the steps above and also
      # re-runs the corpus, the proofs and the freeze-state check. Kept as its own step so a failure
      # names `audit:release` rather than whichever gate it happened to reach first.
      - run: pnpm audit:release
      # POSTGRES IS NOT RUN IN THIS JOB. `prove:postgres` needs a live database; without a
      # DATABASE_URL it reports SKIPPED / NOT PROVEN and exits 0 - a green step that proved nothing,
      # which is the exact shape this job exists to stop. It runs in `postgres-proof` below, against
      # a real service container, where its failure names itself.
      - name: Explain a failure
        if: failure()
        run: |
          echo "::error::A release claim is no longer supported by the evidence it names."
          echo "This job exists because every mechanism in it was once green while a claim was false."
          echo "Do NOT weaken the check to make it pass - fix the claim, or regrade it in docs/claims.json."
          echo "See docs/DEFECTS_FOUND.md sections 15 to 19."

  # A REAL DATABASE, NOT A SKIPPED STEP.
  #
  # This ran nowhere in CI until now, and the reason given was sound as far as it went: a step with no
  # DATABASE_URL prints SKIPPED / NOT PROVEN and exits 0, and a green step that proves nothing is the
  # failure mode this whole workflow exists to prevent. But the alternative to a fake green is a real
  # database, not silence - a service container costs one job and makes the proof reproducible by
  # anyone reading the log rather than only by someone with Postgres on their laptop.
  #
  # ITS OWN JOB, so a red X says "the Postgres proof failed" rather than naming whichever gate it sat
  # inside, and so the claim gates stay fast for the ordinary case.
  #
  # WHAT THIS STILL DOES NOT PROVE, and the script says so on every run: that YOUR hosts share ONE
  # database. That is a fact about infrastructure and nothing here can reach it. The claim in
  # docs/claims.json stays ADAPTER-PROVEN for the deployment question for exactly that reason - this
  # job moves the DATABASE half from "not run in CI" to "run in CI", and moves nothing else.
  postgres-proof:
    name: Real-Postgres concurrency proof
    runs-on: ubuntu-latest
    needs: corpus-integrity
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: containment_ledger_test
        ports: ["5432:5432"]
        # Without this the job races the container's startup and fails on connection refused, which
        # would read as a broken proof rather than a slow database.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Prove concurrency against a live Postgres
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/containment_ledger_test
        run: pnpm prove:postgres
      - name: Refuse a skipped run as a pass
        if: success()
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/containment_ledger_test
        # THE CONTROL ON THIS JOB. `prove:postgres` exits 0 when DATABASE_URL is unset, so a
        # misconfigured service container would turn this job green while proving nothing - the fake
        # green in a new costume. This requires the run to have actually reached the database.
        run: |
          pnpm prove:postgres | tee /tmp/pg.txt
          grep -q "PROVEN against a real Postgres" /tmp/pg.txt || {
            echo "::error::prove:postgres exited 0 without reaching a database."
            echo "A skipped run is NOT a pass. Check the service container, do not delete this check."
            exit 1
          }
      - name: Explain a failure
        if: failure()
        run: |
          echo "::error::The real-database concurrency proof failed."
          echo "Do NOT drop this job to make CI green - the ledger's whole purpose is this property."
          echo "See scripts/prove-postgres.mjs and docs/TRUST_BOUNDARIES.md."

  # The git-object freeze is EXPECTED TO FAIL and is therefore not a gate. It is recorded as
  # attempted_and_failed and exits 1 by design; running it here would make CI permanently red for a
  # limitation the project reports honestly rather than a defect. See STATUS.md.
