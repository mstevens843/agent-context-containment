packages:
  - "packages/*"
  # examples is a workspace member so it can resolve @agent-context-containment/* by name. The sibling repo
  # excludes its examples directory, which means nothing in it can import the packages it is meant
  # to demonstrate - a latent bug there rather than a convention worth copying. It stays `private`
  # so it is never published.
  - "examples"

# Refuse to install any package version published less than 7 days ago (10080 minutes).
# This neutralizes near-real-time worm propagation, which has spread end-to-end in under
# 30 minutes. If you genuinely need a fresh release, drop this to 0 for one install and
# put it straight back.
minimumReleaseAge: 10080
